            "code": "// Shared deterministic rules: the same source is embedded in Dify Code nodes.\nfunction assess(c, processingDate, phase = 'all') {\n  const a = c.application, f = c.facts, reasons = [], evidence = [];\n  const add = (code, text, source) => reasons.push({code, text, source});\n  const dateOK = d => /^\\d{4}-\\d{2}-\\d{2}$/.test(d || '') && !Number.isNaN(Date.parse(d)) && new Date(d).toISOString().slice(0,10) === d;\n  if (!dateOK(processingDate)) add('PROCESS_DATE', '処理日をYYYY-MM-DDで指定してください。', '入力');\n  if (phase !== 'facts') {\n    for (const [k,label] of Object.entries({id:'申請ID',route:'申請経路',owner:'作成担当者',holder:'契約者名',holder_kana:'契約者名カナ',birth_date:'生年月日',requester:'申出人',purpose:'使用目的',base_date:'証明基準日',recipient:'宛名',address:'送付先',postal_code:'郵便番号',shipping_method:'送付方法'})) {\n      if (typeof a[k] !== 'string' || !a[k].trim()) add('MISSING_'+k.toUpperCase(), label+'が不足しています。', '申請DB.'+k);\n    }\n    if (!Array.isArray(a.policies) || !a.policies.length) add('MISSING_POLICY','証券番号が不足しています。','申請DB.policies');\n    if (!dateOK(a.base_date)) add('BASE_DATE','証明基準日が不正です。','申請DB.base_date');\n    else if (dateOK(processingDate) && a.base_date > processingDate) add('FUTURE_DATE','証明基準日が未到来です。','申請DB.base_date');\n    if (a.customer_type !== 'individual') add('CORPORATE','法人契約は初回の自動作成対象外です。','申請DB.customer_type');\n    if (a.policies?.length !== 1) add('MULTI_POLICY','複数契約は人手確認が必要です。','申請DB.policies');\n    if (a.documents?.length !== 1 || a.documents[0] !== 'balance_certificate') add('DOCUMENT_SCOPE','明細書・複数種類・その他帳票は人手確認が必要です。','申請DB.documents');\n    if (a.shipping_method !== 'ordinary_post') add('SHIPPING_SCOPE','今回の自動処理は通常郵便が対象です。','申請DB.shipping_method');\n    if (!['direct','call_slip'].includes(a.route)) add('ROUTE_SCOPE','申請経路を確認してください。','申請DB.route');\n    if (a.route === 'call_slip' && !a.call_slip_id) add('MISSING_CALL_SLIP','承り票番号がありません。','申請DB.call_slip_id');\n    if (a.special_request || a.past_difference) add('REQUEST_CONFIRMATION','特殊依頼または過去案件との差異を確認してください。','申請DB.備考・過去履歴');\n    if (['withdrawn','cancelled'].includes(c.status)) add('WITHDRAWN','取下げ済みのため再開できません。','案件状態');\n    evidence.push('申請DB:'+a.id, '過去作成履歴:'+a.id);\n  }\n  if (phase !== 'receipt') {\n    if (!f || f.retrieval_error) add('RETRIEVAL_FAILED','必要資料を取得できません。再取得または人手確認が必要です。','資料取得');\n    if (f) {\n      for (const key of ['contract','matching','simulation','collection','history']) if (f[key] == null) add('MISSING_SOURCE_'+key.toUpperCase(),key+'資料がありません。','資料取得');\n      const ct = f.contract;\n      if (ct) {\n        if (ct.deleted) add('DELETED_MASTER','契約マスター削除案件は照会が必要です。','契約基本情報');\n        if (ct.currency !== 'JPY') add('FOREIGN_CURRENCY','外貨建ては人手確認が必要です。','契約基本情報.currency');\n        if (ct.policy !== a.policies?.[0] || ct.holder !== a.holder || ct.holder_kana !== a.holder_kana || ct.birth_date !== a.birth_date) add('IDENTITY_MISMATCH','契約者・証券番号・本人照合情報が一致しません。','申請DB/契約基本情報');\n        if (ct.as_of !== a.base_date) add('CONTRACT_DATE_MISMATCH','基準日時点の契約情報ではありません。','契約基本情報.as_of');\n        if (!['active','paid_up','premium_paid'].includes(ct.status)) add('CONTRACT_STATUS','契約状態について個別確認が必要です。','契約状況照会');\n      }\n      if (f.matching && (f.matching.as_of !== a.base_date || JSON.stringify([...f.matching.policies].sort()) !== JSON.stringify([...(a.policies || [])].sort()))) add('UNREQUESTED_POLICY','名寄せ結果に申請外契約または基準日の差異があります。追加・除外の確認が必要です。','名寄せ結果');\n      if (f.inquiry_required) add('INQUIRY_REQUIRED','所管部署への照会と回答が必要です。','ヒストリー/照会管理');\n      if (f.collection?.last_manual_date >= a.base_date && f.history?.some(h=>h.effective_date>=a.base_date && h.affects_balance)) add('POST_DATE_MOVEMENT','基準日以降の残高影響異動を確認してください。','収納情報/ヒストリー');\n      const sim = f.simulation;\n      if (sim) {\n        if (sim.error) add('SIMULATION_ERROR','返済試算エラーのため金額を確定できません。','保険料お立替金返済試算');\n        if (sim.as_of !== a.base_date) add('AMOUNT_DATE_MISMATCH','試算金額の基準日が一致しません。','返済試算.as_of');\n        for (const k of ['principal','interest','balance']) if (!Number.isSafeInteger(sim[k]) || sim[k]<0) add('INVALID_AMOUNT_'+k,'金額が未取得または不正です。','返済試算.'+k);\n        if (sim.balance === 0) add('ZERO_BALANCE','残高0円は明細書の要否確認が必要です。','返済試算.balance');\n        if (Number.isSafeInteger(sim.principal) && Number.isSafeInteger(sim.interest) && sim.principal + sim.interest !== sim.balance) add('AMOUNT_TOTAL','元金と利息の合計が残高と一致しません。','返済試算');\n        const h = f.history?.filter(h=>h.effective_date<=a.base_date).at(-1);\n        if (!h) add('HISTORY_MISSING','基準日時点の履歴を確認できません。','ヒストリー');\n        else if (h.as_of !== a.base_date || ['principal','interest','balance'].some(k=>h[k]!==sim[k])) add('AMOUNT_MISMATCH','同一基準日の試算とヒストリーの金額が一致しません。','返済試算/ヒストリー');\n      }\n      evidence.push('名寄せ:'+a.id,'契約状況:'+a.policies?.[0],'返済試算:'+a.base_date,'収納情報:'+a.id,'ヒストリー:'+a.id);\n    }\n  }\n  return {result:reasons.length ? (reasons.some(r=>r.code==='FUTURE_DATE')?'held':'human_review') : 'ready',reasons,evidence,missing:reasons.filter(r=>r.code.startsWith('MISSING')).map(r=>r.text),next_stage:reasons.length?'人手確認':'帳票作成',human_required:reasons.length>0};\n}\n\nconst ROLES={\"creator\":{\"label\":\"作成担当 デモ担当A\",\"name\":\"デモ担当A\"},\"checker\":{\"label\":\"2次点検 デモ担当B\",\"name\":\"デモ担当B\"},\"precheck\":{\"label\":\"発送前点検 デモ担当C\",\"name\":\"デモ担当C\"},\"shipper\":{\"label\":\"発送担当 デモ担当D\",\"name\":\"デモ担当D\"},\"shipcheck\":{\"label\":\"発送点検 デモ担当E\",\"name\":\"デモ担当E\"}};\nconst STAGES=[{\"id\":\"self_check\",\"label\":\"自己点検\",\"role\":\"creator\",\"next\":\"secondary_check\"},{\"id\":\"secondary_check\",\"label\":\"2次点検\",\"role\":\"checker\",\"next\":\"pre_shipping\"},{\"id\":\"pre_shipping\",\"label\":\"発送前点検\",\"role\":\"precheck\",\"next\":\"shipping\"},{\"id\":\"shipping\",\"label\":\"封入・発送準備\",\"role\":\"shipper\",\"next\":\"shipping_check\"},{\"id\":\"shipping_check\",\"label\":\"発送点検・模擬発送\",\"role\":\"shipcheck\",\"next\":\"ready_to_complete\"}];\nfunction logEvent(c,kind,detail){c.audit.push({at:new Date().toISOString(),kind,revision:c.revision,detail});}\nfunction present(c){\n const a=c.application,s=c.facts.simulation;\n const table=rows=>'| 項目 | 内容 |\\n| --- | --- |\\n'+rows.map(([k,v])=>'| '+k+' | '+String(v??'未取得').replace(/\\|/g,'／').replace(/\\r?\\n/g,' ')+' |').join('\\n');\n const common=[['申請ID',c.id],['帳票版',c.revision],['契約者名',a.holder],['証券番号',a.policies.join(', ')],['証明基準日',a.base_date]];\n const certificate='# 自動貸付保険料残高証明書\\n\\n検証用 架空データ\\n\\n'+table([...common,['通貨','日本円'],['お立替元金',s.principal],['利息',s.interest],['自動貸付保険料残高',s.balance],['最終払込年月',c.facts.contract.last_paid_month],['作成日',c.processing_date]])+'\\n\\n金額は円単位です。正式な証明書として使用できません。';\n const cover='# 送付状\\n\\n検証用 架空データ\\n\\n'+table([['申請ID',c.id],['帳票版',c.revision],['郵便番号',a.postal_code],['送付先',a.address],['宛名',a.recipient],['同封書類','自動貸付保険料残高証明書'],['部数',1],['証明書枚数',1],['発送方法','通常郵便'],['作成担当',a.owner]])+'\\n\\n実際の発送は行いません。';\n const sources='### 申請と契約の照合\\n\\n'+table([...common,['契約者カナ',a.holder_kana],['生年月日',a.birth_date],['名寄せの契約',c.facts.matching?.policies?.join(', ')],['契約情報の基準日',c.facts.contract.as_of],['試算の基準日',s.as_of],['履歴の基準日',c.facts.history[0]?.as_of],['履歴の元金',c.facts.history[0]?.principal],['履歴の利息',c.facts.history[0]?.interest],['履歴の残高',c.facts.history[0]?.balance],['送付先',a.address],['宛名',a.recipient]])+'\\n\\n### 判定根拠\\n'+(c.decision?.evidence||[]).join(' / ');\n const issues=(c.decision?.reasons||[]).map(r=>'- '+r.text).join('\\n');\n const checkedNames=Object.keys(c.checks||{}).map(key=>STAGES.find(stage=>stage.id===key)?.label||key);\n const completion=c.stage==='completed'?'\\n\\n**模擬発送完了** 発送日 '+c.shipping.date+' / 通常郵便 1件 / 発送簿突合済み / 承り票 '+(c.call_slip_status||'対象外'):'';\n const summary='## '+c.id+' '+c.label+'\\n\\n状態: '+c.status+' / 帳票版: '+c.revision+completion+'\\n\\n'+(issues||'未解決の確認事項はありません。')+'\\n\\n'+sources+'\\n\\n確認済み工程: '+checkedNames.join(' / ')+'\\n\\nこのデモは実行単位で状態を保持します。別の実行との重複は一元管理しません。';\n const history='# 処理証跡\\n\\n'+table([['申請ID',c.id],['状態',c.status],['帳票版',c.revision],['無効版',c.invalid_revisions.join(', ')||'なし'],['承り票',c.call_slip_status||'対象外'],['模擬発送日',c.shipping?.date||'未発送'],['模擬発送件数',c.shipping?1:0]])+'\\n\\n| 記録日時 | 工程 | 帳票版 | 内容 |\\n| --- | --- | --- | --- |\\n'+c.audit.map(e=>'| '+[e.at,e.kind,e.revision,JSON.stringify(e.detail)].map(v=>String(v).replace(/\\|/g,'／').replace(/\\r?\\n/g,' ')).join(' | ')+' |').join('\\n');\n // The native exporter does not set column widths. One text column lets Excel\n // display full lines across empty cells and keeps identifiers as literal text.\n const oneColumn=(title,lines)=>'| '+title+' |\\n| --- |\\n'+lines.map(t=>'| '+String(t).replace(/\\|/g,'／').replace(/\\r?\\n/g,' ')+' |').join('\\n');\n const excelFrom=md=>oneColumn(md.split('\\n')[0].replace(/^# /,''),['検証用・架空データ',...md.split('\\n').filter(l=>l.startsWith('| ')&&!l.startsWith('| 項目')&&!l.startsWith('| ---')).map(l=>l.slice(2,-2).split(' | ').join('：'))]);\n const auditLines=['検証用・架空データ','申請ID：'+c.id,'状態：'+c.status,'帳票版：'+c.revision,'無効版：'+(c.invalid_revisions.join(', ')||'なし'),'承り票：'+(c.call_slip_status||'対象外'),'模擬発送件数：'+(c.shipping?1:0)];\n function flatten(value,prefix=''){if(value&&typeof value==='object'){for(const [k,v] of Object.entries(value))flatten(v,prefix?prefix+'.'+k:k);}else auditLines.push(prefix+'：'+String(value??''));}\n for(const [i,e] of c.audit.entries()){auditLines.push('【'+(i+1)+'】'+e.kind,'記録日時：'+e.at,'帳票版：'+e.revision);flatten(e.detail);}\n return {state_json:JSON.stringify(c),summary,certificate_md:certificate,cover_md:cover,audit_md:history,certificate_excel_md:excelFrom(certificate),cover_excel_md:excelFrom(cover),audit_excel_md:oneColumn('処理証跡',auditLines),certificate_name:c.id+'_残高証明書_v'+String(c.revision).padStart(3,'0'),cover_name:c.id+'_送付状_v'+String(c.revision).padStart(3,'0'),audit_name:c.id+'_処理証跡',ready:c.stage==='self_check'?1:0,rework:c.stage==='correction'?1:0,can_complete:c.stage==='ready_to_complete'?1:0};\n}\nfunction initialize(caseId,date){\n const original=fixtures().find(c=>c.id===caseId);if(!original)throw Error('サンプル案件を選択してください。');\n const c=JSON.parse(JSON.stringify(original));c.processing_date=date;c.audit=[];c.invalid_revisions=[];c.checks={};c.shipping=null;c.decision=assess(c,date);\n logEvent(c,'受付・名寄せ・金額照合',c.decision);\n if(c.decision.result==='ready'){c.revision=1;c.stage='self_check';c.status='証明書作成中';c.snapshot=JSON.stringify({application:c.application,facts:c.facts});logEvent(c,'帳票データ確定',{revision:1});}\n else{c.stage=c.decision.result;c.status=c.stage==='held'?'保留':'人手確認';}\n return present(c);\n}\nfunction review(stateJson,stage,actor,confirmation,comment,action){\n const c=JSON.parse(stateJson),def=STAGES.find(x=>x.id===stage);\n if(c.stage!==stage)return present(c);\n const fail=message=>{c.status='入力確認';c.stage='human_error';c.decision={result:'human_review',reasons:[{code:'REVIEW_INPUT',text:message,source:def.label}],evidence:c.decision.evidence};logEvent(c,'点検入力エラー',{stage,message});return present(c);};\n if(actor!==ROLES[def.role].label)return fail('担当役割が違います。'+ROLES[def.role].label+'を選択してください。');\n if(action==='reject'&&!comment.trim())return fail('差戻しには理由を入力してください。');\n if(action==='approve'&&confirmation!=='確認済')return fail('点検項目を確認済みにしてください。');\n if(c.snapshot!==JSON.stringify({application:c.application,facts:c.facts}))return fail('原情報が帳票確定時から変わっています。');\n logEvent(c,def.label,{actor,confirmation,comment,action});\n if(action==='reject'){\n  c.invalid_revisions.push(c.revision);c.checks={};c.stage='correction';c.status='修正中';c.decision={result:'correction',reasons:[{code:'REJECTED',text:comment,source:def.label}],evidence:c.decision.evidence};\n }else if(action==='approve'){c.checks[stage]={actor,at:new Date().toISOString(),revision:c.revision,confirmation};c.stage=def.next;c.status=c.stage==='secondary_check'?'上長確認依頼':c.stage==='ready_to_complete'?'発送待ち':'確認完了';}\n else return fail('点検結果を選択してください。');\n return present(c);\n}\nfunction amend(stateJson,recipient,address,reason){\n const c=JSON.parse(stateJson);if(!reason?.trim())throw Error('修正理由を入力してください。');\n const before={recipient:c.application.recipient,address:c.application.address};\n if(recipient?.trim())c.application.recipient=recipient.trim();if(address?.trim())c.application.address=address.trim();\n c.checks={};c.revision++;c.stage='self_check';c.status='証明書作成中';c.decision=assess(c,c.processing_date);c.snapshot=JSON.stringify({application:c.application,facts:c.facts});\n logEvent(c,'修正・再作成',{before,after:{recipient:c.application.recipient,address:c.application.address},reason});\n if(c.decision.result!=='ready'){c.stage=c.decision.result;c.status='人手確認';}\n return present(c);\n}\nfunction complete(stateJson){\n const c=JSON.parse(stateJson);if(c.stage!=='ready_to_complete')return present(c);\n if(STAGES.some(s=>!c.checks[s.id]||c.checks[s.id].revision!==c.revision))throw Error('点検未完了のため発送できません。');\n c.shipping={date:c.processing_date,method:'ordinary_post',recipient:c.application.recipient,address:c.application.address,dispatch_count:1,simulated:true,reconciled:true};\n if(c.application.route==='call_slip')c.call_slip_status='完了';\n c.stage='completed';c.status='発送完了';logEvent(c,'模擬発送・発送簿突合',{shipping:c.shipping,call_slip_status:c.call_slip_status});return present(c);\n}\n\nfunction main({state_json,actor,confirmation,comment}){if(JSON.parse(state_json).stage!=='secondary_check')throw Error('現在工程が一致しません。処理を停止しました。');const r=review(state_json,'secondary_check',actor,confirmation,comment,'reject');if(JSON.parse(r.state_json).stage==='human_error')throw Error(JSON.parse(r.state_json).decision.reasons[0].text);return r;}",
