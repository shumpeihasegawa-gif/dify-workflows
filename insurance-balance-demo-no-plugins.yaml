              }
            ],
            "form_content": "## 2次点検\n\n{{#2012.summary#}}\n\n### 作成帳票\n\n{{#2002.certificate_md#}}\n\n{{#2002.cover_md#}}\n\n### 帳票出力\n\n互換確認版は上記の画面表示のみです。Excel/PDF生成を省いています。\n\n\n\n\n\n申請・契約・基準日・金額・宛先・帳票種類・部数と別案件の混入がないことを確認してください。\n\n担当役割は **2次点検 デモ担当B** です。\n{{#$output.actor#}}\n\n点検結果\n{{#$output.confirmation#}}\n\n確認内容 または 差戻し理由（必須）\n{{#$output.comment#}}",
